[profile.default]
libs = ["lib"]
names = true
sizes = true
via_ir = true
optimizer = true
optimizer_runs = 999999
bytecode_hash = "none"
evm_version = "shanghai"
# The LCC vault/factory and USD3 exceed the bytecode size limit at max runs. Compile them at reduced runs while
# keeping the default profile optimized for the rest of the repo. The LCC module pins solc 0.8.35 here (its
# pragma is a range so Hardhat's macOS binary, which self-reports 0.8.35-pre, can also compile it).
additional_compiler_profiles = [
    { name = "lcc-size", optimizer_runs = 600 },
    { name = "usd3-size", optimizer_runs = 200 },
]
compilation_restrictions = [
    { paths = "src/lcc/**", version = "=0.8.35" },
    { paths = "src/lcc/LeveragedCallableCreditVault.sol", optimizer_runs = 600 },
    { paths = "src/lcc/LeveragedCallableCreditVaultFactory.sol", optimizer_runs = 600 },
    { paths = "src/usd3/USD3.sol", optimizer_runs = 200 },
]

[profile.default.invariant]
runs = 16
depth = 256
fail_on_revert = true

[profile.default.fmt]
wrap_comments = true

[profile.build]
test = "/dev/null"
script = "/dev/null"

[profile.test]
via-ir = false
script = "/dev/null"
# Run all tests but exclude IRM tests
no_match_path = "**/irm/**"

[profile.test-irm]
# IRM tests need via-ir due to stack complexity
via-ir = true
script = "/dev/null"
optimizer_details.optimizerSteps = "u"
# Only run IRM tests
match_path = "**/irm/**"

[profile.halmos]
# IRM tests need via-ir due to stack complexity
via-ir = false
script = "/dev/null"
test = "test/halmos"

[profile.fork]
# Fork tests configuration
test = "test/forge/usd3/fork"
via_ir = false
fork_block_number = 23400200  # Fixed block for reproducibility

# See more config options https://github.com/foundry-rs/foundry/tree/master/crates/config
