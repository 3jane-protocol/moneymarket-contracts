[profile.default]
libs = ["lib"]
names = true
sizes = true
via_ir = true
optimizer = true
optimizer_runs = 999999
bytecode_hash = "none"
evm_version = "shanghai"
# LCCVault pins optimizer_runs = 150 (24,126 B runtime, 150 B below the 24,276 release ceiling, 450 B EIP-170 margin). The frozen USD3_old
# upgrade-test artifact pins optimizer_runs = 200 for a different reason: it is the pre-cleanup implementation, and
# under the test profile (via-ir disabled) it hits solc "Stack too deep" at higher runs, so the low pin is what lets
# it compile without via-ir. It is a test-only fixture (deployed only inside the upgrade tests), so its runs are
# otherwise immaterial. USD3 itself fits at the repo default with a thin ~862 B margin (23,714 B measured at 999999
# runs), so future features may need a lower pin or cleanup. Foundry produces the canonical LCC deployment artifact
# with official solc 0.8.35; Hardhat uses pinned stable solc-js for compilation but its output is non-canonical.
additional_compiler_profiles = [
    { name = "lcc-cancun", evm_version = "cancun" },
    { name = "lcc-vault-size", optimizer_runs = 150, evm_version = "cancun" },
    { name = "usd3-size", optimizer_runs = 200 },
]
compilation_restrictions = [
    { paths = "src/lcc/**", version = "=0.8.35", evm_version = "cancun" },
    { paths = "src/lcc/LCCVault.sol", optimizer_runs = 150, evm_version = "cancun" },
    { paths = "src/usd3/USD3_old.sol", optimizer_runs = 200 },
]

[profile.default.invariant]
runs = 16
depth = 256
fail_on_revert = true

[profile.default.fmt]
wrap_comments = true

[profile.build]
test = "/dev/null"
script = "/dev/null"
extra_output = ["storageLayout"]

[profile.test]
via-ir = false
evm_version = "cancun"
script = "/dev/null"
# Run all tests but exclude IRM tests
no_match_path = "**/irm/**"

[profile.test-irm]
# IRM tests need via-ir due to stack complexity
via-ir = true
script = "/dev/null"
optimizer_details.optimizerSteps = "u"
# Only run IRM tests
match_path = "**/irm/**"

[profile.halmos]
# IRM tests need via-ir due to stack complexity
via-ir = false
script = "/dev/null"
test = "test/halmos"

[profile.fork]
# Fork tests configuration
test = "test/forge/usd3/fork"
via_ir = false
fork_block_number = 23400200  # Fixed block for reproducibility

# See more config options https://github.com/foundry-rs/foundry/tree/master/crates/config
