[profile.default]
libs = ["lib"]
names = true
sizes = true
via_ir = true
optimizer = true
optimizer_runs = 999999
bytecode_hash = "none"
evm_version = "shanghai"
fs_permissions = [
    { access = "read", path = "docs/lcc-vault-storage-layout.json" },
    { access = "read", path = "out/LCCVault.sol" },
    { access = "read", path = "out/LCCAuctionLib.sol" },
    { access = "read", path = "out/LCCConfigLib.sol" },
    { access = "read", path = "out/LCCExitLib.sol" },
    { access = "read", path = "out/LCCVaultFactory.sol" },
]
# LCCVault pins optimizer_runs = 150 (24,268 B runtime after extracting exit accounting to LCCExitLib, leaving 108 B
# below the 24,376 release ceiling and 308 B below EIP-170). The active-only monolith measures 24,703 B, so the
# extraction remains necessary. The frozen USD3_old upgrade-test artifact pins optimizer_runs = 200 because its test
# profile disables via-ir and higher runs hit solc "Stack too deep"; the pin lets this test-only fixture compile without
# via-ir. Its optimizer runs are otherwise immaterial. USD3 itself fits at the repo default with a thin
# ~862 B margin (23,714 B measured at 999999 runs), so future features may need a lower pin or cleanup. Foundry produces
# the canonical LCC deployment artifact with official solc 0.8.35; Hardhat uses pinned stable solc-js for compilation
# but its output is non-canonical.
# src/usd3 is a Shanghai module — explicit so cancun-based profiles (test, script) keep production codegen. NV's source pragma caps canonical builds below 0.8.36 everywhere; the deploy script pins the deployed unit to 0.8.35, and scripts/check-lcc-release-artifact.js backstops build settings.
additional_compiler_profiles = [
    { name = "lcc-cancun", evm_version = "cancun" },
    { name = "lcc-vault-size", optimizer_runs = 150, evm_version = "cancun" },
    { name = "usd3-size", optimizer_runs = 200, evm_version = "shanghai" },
    { name = "usd3-shanghai", evm_version = "shanghai" },
]
compilation_restrictions = [
    { paths = "src/lcc/**", version = "=0.8.35", evm_version = "cancun" },
    { paths = "src/lcc/LCCVault.sol", optimizer_runs = 150, evm_version = "cancun" },
    { paths = "src/usd3/USD3_old.sol", optimizer_runs = 200, evm_version = "shanghai" },
    { paths = "src/usd3/**", evm_version = "shanghai" },
]

[profile.default.invariant]
runs = 16
depth = 256
fail_on_revert = true

[profile.default.fmt]
wrap_comments = true

[profile.build]
test = "/dev/null"
script = "/dev/null"
extra_output = ["storageLayout"]

[profile.test]
via_ir = false
evm_version = "cancun"
script = "/dev/null"
# Run all tests but exclude IRM tests
no_match_path = "**/irm/**"

[profile.test-lcc-ir]
# Runs the LCC suite (via test:forge:lcc:ir) under via-IR + Cancun to match the release artifact's compiler settings.
evm_version = "cancun"
script = "/dev/null"
no_match_path = "**/irm/**"

[profile.test-irm]
# IRM tests need via-ir due to stack complexity
script = "/dev/null"
optimizer_details.optimizerSteps = "u"
# Only run IRM tests
match_path = "**/irm/**"

[profile.halmos]
# IRM tests need via-ir due to stack complexity
via_ir = false
script = "/dev/null"
test = "test/halmos"

[profile.fork]
# Fork tests configuration
test = "test/forge/usd3/fork"
via_ir = false
script = "/dev/null"
fork_block_number = 23400200  # Fixed block for reproducibility

[profile.script]
test = "/dev/null"
ffi = true
extra_output = ["storageLayout"]
evm_version = "cancun"
fs_permissions = [
    { access = "read", path = "./data" },
]

# See more config options https://github.com/foundry-rs/foundry/tree/master/crates/config
