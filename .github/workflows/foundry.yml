name: Foundry

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  script-build:
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.action != 'labeled')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build Forge deployment scripts
        run: yarn -s build:forge:script

  forge-baseline-fast:
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.action != 'labeled')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run Forge non-invariant tests (fast)
        run: yarn -s test:forge:noninvariant -vvv
        env:
          FOUNDRY_FUZZ_RUNS: 256
          FOUNDRY_FUZZ_MAX_TEST_REJECTS: 65536
          FOUNDRY_FUZZ_SEED: 0x${{ github.event.pull_request.base.sha || github.sha }}

  forge-baseline-deep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run Forge non-invariant tests (deep)
        run: yarn -s test:forge:noninvariant -vvv
        env:
          FOUNDRY_FUZZ_RUNS: 10000
          FOUNDRY_FUZZ_MAX_TEST_REJECTS: 500000
          FOUNDRY_FUZZ_SEED: 0x${{ github.sha }}

  irm-tests:
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.action != 'labeled')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Log IRM Seed
        run: 'echo "IRM seed: 0x${{ github.event.pull_request.base.sha || github.sha }}"'

      - name: Run IRM Forge tests
        run: yarn -s test:forge:irm
        env:
          FOUNDRY_PROFILE: test-irm
          FOUNDRY_FUZZ_SEED: 0x${{ github.event.pull_request.base.sha || github.sha }}

  lcc-ir-tests:
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.action != 'labeled')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Log LCC via-IR Seed
        run: 'echo "LCC via-IR seed: 0x${{ github.event.pull_request.base.sha || github.sha }}"'

      - name: Run LCC tests via IR
        run: yarn -s test:forge:lcc:ir
        env:
          FOUNDRY_FUZZ_SEED: 0x${{ github.event.pull_request.base.sha || github.sha }}

  core-invariant-fast:
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.action != 'labeled')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Log Invariant Seed
        run: 'echo "Core invariant seed: 0x${{ github.event.pull_request.base.sha || github.sha }}"'

      - name: Warm Solc Cache
        run: yarn -s build:forge

      - name: Run Core Invariants (fast)
        run: yarn -s test:forge:invariant:core
        env:
          FOUNDRY_PROFILE: test
          FOUNDRY_INVARIANT_RUNS: 32
          FOUNDRY_INVARIANT_DEPTH: 512
          FOUNDRY_FUZZ_SEED: 0x${{ github.event.pull_request.base.sha || github.sha }}

  core-invariant-deep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Log Invariant Seed
        run: 'echo "Core invariant seed: 0x${{ github.sha }}"'

      - name: Warm Solc Cache
        run: yarn -s build:forge

      - name: Run Core Invariants (deep)
        run: yarn -s test:forge:invariant:core:deep
        env:
          FOUNDRY_PROFILE: test
          FOUNDRY_INVARIANT_RUNS: 256
          FOUNDRY_INVARIANT_DEPTH: 1024
          FOUNDRY_FUZZ_SEED: 0x${{ github.sha }}

  usd3-invariant-fast:
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.action != 'labeled')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Log Invariant Seed
        run: 'echo "USD3 invariant seed: 0x${{ github.event.pull_request.base.sha || github.sha }}"'

      - name: Warm Solc Cache
        run: yarn -s build:forge

      - name: Run USD3 Invariants (fast)
        run: yarn -s test:forge:invariant:usd3
        env:
          FOUNDRY_PROFILE: test
          FOUNDRY_INVARIANT_RUNS: 32
          FOUNDRY_INVARIANT_DEPTH: 512
          FOUNDRY_FUZZ_SEED: 0x${{ github.event.pull_request.base.sha || github.sha }}

  usd3-invariant-deep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Log Invariant Seed
        run: 'echo "USD3 invariant seed: 0x${{ github.sha }}"'

      - name: Warm Solc Cache
        run: yarn -s build:forge

      - name: Run USD3 Invariants (deep)
        run: yarn -s test:forge:invariant:usd3:deep
        env:
          FOUNDRY_PROFILE: test
          FOUNDRY_INVARIANT_RUNS: 256
          FOUNDRY_INVARIANT_DEPTH: 1024
          FOUNDRY_FUZZ_SEED: 0x${{ github.sha }}

  lcc-invariant-fast:
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.action != 'labeled')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Log Invariant Seed
        run: 'echo "LCC invariant seed: 0x${{ github.event.pull_request.base.sha || github.sha }}"'

      - name: Build and check LCC release artifact
        run: yarn -s build:forge:size

      - name: Run LCC Invariants (fast)
        run: yarn -s test:forge:invariant:lcc
        env:
          FOUNDRY_PROFILE: test
          FOUNDRY_INVARIANT_RUNS: 32
          FOUNDRY_INVARIANT_DEPTH: 512
          FOUNDRY_FUZZ_SEED: 0x${{ github.event.pull_request.base.sha || github.sha }}

  lcc-invariant-deep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Log Invariant Seed
        run: 'echo "LCC invariant seed: 0x${{ github.sha }}"'

      - name: Build and check LCC release artifact
        run: yarn -s build:forge:size

      - name: Run LCC Invariants (deep)
        run: yarn -s test:forge:invariant:lcc:deep
        env:
          FOUNDRY_PROFILE: test
          FOUNDRY_INVARIANT_RUNS: 256
          FOUNDRY_INVARIANT_DEPTH: 1024
          FOUNDRY_FUZZ_SEED: 0x${{ github.sha }}

  fork-tests:
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci/run-fork-tests'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Log Fork Seed
        run: 'echo "Fork seed: 0x${{ github.event.pull_request.base.sha || github.sha }}"'

      - name: Run Fork tests
        run: yarn -s test:forge:fork
        env:
          FOUNDRY_PROFILE: fork
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          FOUNDRY_FUZZ_SEED: 0x${{ github.event.pull_request.base.sha || github.sha }}

      - name: Run Fork upgrade tests
        run: yarn -s test:forge:fork:upgrade
        env:
          FOUNDRY_PROFILE: fork
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          FOUNDRY_FUZZ_SEED: 0x${{ github.event.pull_request.base.sha || github.sha }}
